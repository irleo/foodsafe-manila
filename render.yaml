version: "1"
services:
- type: web
  name: foodsafe-frontend
  runtime: static
  repo: https://github.com/irleo/foodsafe-manila
  branch: production
  envVars:
  - key: VITE_API_BASE_URL
    sync: false
  buildCommand: npm ci && npm run build
  staticPublishPath: dist
  domains:
  - foodsafe-manila.online
  - www.foodsafe-manila.online
  routes:
  - type: rewrite
    source: /*
    destination: /index.html
  headers:
  - path: /*
    name: Strict-Transport-Security
    value: max-age=31536000
  - path: /*
    name: X-Frame-Options
    value: SAMEORIGIN
  - path: /*
    name: Referrer-Policy
    value: strict-origin-when-cross-origin
  - path: /*
    name: Permissions-Policy
    value: camera=(), microphone=(), geolocation=()
  - path: /*
    name: Content-Security-Policy
    value: 'default-src ''self''; base-uri ''self''; object-src ''none''; frame-ancestors
      ''self''; form-action ''self''; script-src ''self''; style-src ''self'' ''unsafe-inline'';
      img-src ''self'' data: blob: https://*.tile.openstreetmap.org; font-src ''self''
      data:; connect-src ''self'' https://food-safe-backend.onrender.com; upgrade-insecure-requests'
  autoDeployTrigger: "off"
  rootDir: frontend
- type: web
  name: foodsafe-backend
  runtime: node
  repo: https://github.com/irleo/foodsafe-manila
  branch: production
  plan: starter
  envVars:
  - key: MONGO_URI
    sync: false
  - key: BREVO_RESET_OTP_TEMPLATE_ID
    sync: false
  - key: BREVO_ACCESS_OTP_TEMPLATE_ID
    sync: false
  - key: BREVO_API_KEY
    sync: false
  - key: ALLOWED_ORIGINS
    sync: false
  - key: PYTHON_BIN
    sync: false
  - key: REFRESH_TOKEN_SECRET
    sync: false
  - key: ACCESS_TOKEN_SECRET
    sync: false
  - key: NODE_ENV
    sync: false
  region: oregon
  buildCommand: npm ci && python3 -m pip install -r services/prophet/requirements.txt
  startCommand: npm start
  healthCheckPath: /api/health
  autoDeployTrigger: "off"
  rootDir: backend
