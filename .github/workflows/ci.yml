name: FoodSafe CI

# Run before merging and again on the merged production commit.
on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

# These checks only need permission to read the repository.
permissions:
  contents: read

# Stop an older quality run when a newer commit replaces it.
concurrency:
  group: foodsafe-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: node --test "tests/*.test.js"

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o \
            -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check

      - name: Run backend tests
        run: node --test "tests/*.test.js"

  python:
    name: Forecast regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/services/prophet/requirements.txt

      - name: Install forecasting dependencies
        run: python -m pip install -r backend/services/prophet/requirements.txt

      - name: Run synthetic forecasting tests
        run: >
          python -m unittest discover
          -s backend/tests
          -p 'forecast_monthly_*_test.py'
