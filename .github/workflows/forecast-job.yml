name: Forecast generation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match the selected branch)
        required: true
        type: choice
        options:
          - testing
          - production
      datasetId:
        required: true
        type: string
      predictionRunId:
        required: true
        type: string

permissions:
  contents: read

# Per-job groups avoid replacing unrelated pending uploads. The database's
# atomic claim also prevents duplicate workflow invocations executing a job.
concurrency:
  group: forecast-job-${{ inputs.environment }}-${{ inputs.predictionRunId }}
  cancel-in-progress: false

jobs:
  forecast:
    if: (inputs.environment == 'testing' && github.ref == 'refs/heads/testing') || (inputs.environment == 'production' && github.ref == 'refs/heads/production')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: forecast-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.12'
          enable-cache: true
          cache-dependency-glob: backend/services/prophet/requirements.txt
      - run: npm ci --omit=dev
        working-directory: backend
      - name: Install Python dependencies
        run: uv pip install --system --python python -r backend/services/prophet/requirements.txt
      - name: Claim and execute forecast job
        run: node backend/scripts/runGitHubForecastJob.js
        env:
          FORECAST_MONGO_URI: ${{ secrets.FORECAST_MONGO_URI }}
          FORECAST_DB_NAME: ${{ vars.FORECAST_DB_NAME }}
          FORECAST_ENVIRONMENT: ${{ inputs.environment }}
          DATASET_ID: ${{ inputs.datasetId }}
          PREDICTION_RUN_ID: ${{ inputs.predictionRunId }}
          PYTHON_BIN: python
          PROPHET_PROCESS_TIMEOUT_MS: '300000'
          FORECAST_MODEL_CONCURRENCY: '2'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
