name: foodsafe_manila
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_map_location_marker: ^10.2.0
  flutter_screenutil: ^5.9.3
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_fonts: ^7.0.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  location: ^8.0.1
  flutter_local_notifications: ^19.0.0
  http: ^1.1.1
  lucide_icons_flutter: ^3.1.13
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  image_path: assets/foodsafe_icon.png

  adaptive_icon_background: assets/foodsafe_icon_background.png
  adaptive_icon_foreground: assets/foodsafe_icon_foreground.png

flutter_native_splash:
  color: "#2563EB"
  image: assets/foodsafe_icon.png

  android_12:
      color: "#2563EB"
      image: assets/foodsafe_icon.png


flutter:
  assets:
    - assets/
  uses-material-design: true
